<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nibras - Sign Up</title>
<script>
    (function () {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    })();
</script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="./signup-ins.css">
</head>
<body class="signup-page">
    <div id="app-root" hidden></div>

    <!-- Starry Background (Visible Only in Dark Mode) -->
    <div class="stars-container">
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>
    </div>

    <!-- Header -->
    <header class="auth-header">
        <div class="logo-area">
            <!-- Logo is white in both designs -->
            <img src="/Assets/images/logo-dark.png" alt="Nibras Logo" class="auth-logo">
        </div>
        
        <!-- Theme Toggle Button -->
        <button class="theme-toggle-btn" id="themeBtn">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- Main Content -->
    <div class="auth-container">
        <div class="auth-card">
             
            <h2 class="auth-title">Create an account</h2>
            <p id="signupNotice" class="auth-notice" hidden></p>

            <form id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="nameInput" placeholder="Your full name" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Email (Gmail only)</label>
                    <input type="email" id="emailInput" placeholder="you@example.com" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" placeholder="Enter your password" class="form-control" id="passInput" required>
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePass('passInput', this)"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" placeholder="Confirm your password" class="form-control" id="confPassInput" required>
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePass('confPassInput', this)"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login">Sign Up</button>
            </form>

            <form id="otpForm" hidden>
                <h3 class="auth-subtitle">Verify your email OTP</h3>
                <p class="auth-note">We sent a 6-digit OTP to <strong id="otpEmailLabel"></strong>. Enter it below to activate your account.</p>
                <div class="form-group">
                    <label>Email (Gmail only)</label>
                    <input type="email" id="otpEmailInput" placeholder="you@example.com" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>OTP code</label>
                    <input type="text" id="otpCodeInput" placeholder="6-digit OTP" class="form-control" maxlength="6" inputmode="numeric" required>
                </div>
                <button type="submit" class="btn-login">Verify OTP</button>
                <button type="button" id="otpBackBtn" class="btn-secondary">Back to sign up</button>
            </form>

            <!-- Role Toggle Link -->
            <div class="signup-link">
                <span id="roleQuestion">Are You student ?</span>
                <a href="../signup.html" id="roleToggleBtn" onclick="toggleRole(event)">Sign Up</a>
            </div>

            <div class="signup-link" style="margin-top: 0.5rem;">
                Already Have An Account ? <a href="../../loginPage/login.html">Log In</a>
            </div>

        </div>
    </div>
    <script src="../../../gateway-host.js"></script>
    <script src="../../../config.js"></script>
    <script src="../../../react-bootstrap.js"></script>
    <script src="../signup.js"></script>
</body>
</html>
